<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Metadata & Styles -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Hedonics Video Marketing</title>
  <link rel="stylesheet" href="styles/default.css">
  <script src="scripts/main.js" defer></script>
  <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Header + Nav -->
  <header>
    <h1>Contact Us</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Main: contact form -->
  <main>
    <h2>Get in Touch</h2>
    <form action="#" method="post" onsubmit="return false;">
      <!-- Name field -->
      <label for="name">Name <span style="color:#ff6600">*</span></label>
      <input type="text" id="name" required>

      <!-- Email field -->
      <label for="email">Email <span style="color:#ff6600">*</span></label>
      <input type="email" id="email" required>

      <!-- Message field -->
      <label for="msg">Message</label>
      <textarea id="msg" rows="4"></textarea>

      <!-- Submit button -->
      <button type="submit" style="margin-top:12px; background:#0077cc;color:#fff;padding:8px 16px;border:none;border-radius:4px;">
        Send
      </button>
    </form>
  </main>

  <!-- Footer -->
  <footer>
    &copy; 2025 Hedonics Video Marketing
  </footer>
</body>
</html>
