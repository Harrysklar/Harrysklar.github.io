    <h2>Get in Touch</h2>
    <form action="#" method="post" onsubmit="return false;">
      <label for="name">Name <span style="color:#ff6600">*</span></label>
      <input type="text" id="name" required>
      <label for="email">Email <span style="color:#ff6600">*</span></label>
      <input type="email" id="email" required>
      <label for="msg">Message</label>
      <textarea id="msg" rows="4"></textarea>
      <button type="submit" style="margin-top:12px; background:#0077cc;color:#fff;padding:8px 16px;border:none;border-radius:4px;">Send</button>
    </form>
