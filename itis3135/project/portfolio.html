<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Metadata & Styles -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portfolio — Hedonics Video Marketing</title>
  <link rel="stylesheet" href="styles/default.css">
  <script src="scripts/main.js" defer></script>
  <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>

  <!-- Page-specific CSS for video overlays & headings -->
  <style>
    .section-subheading {
      font-size: 1.5em;
      color: #0077cc;
      margin-top: 1.5em;
      margin-bottom: 0.5em;
    }
    .video-wrapper {
      position: relative;
      margin: 1em 0;
      max-width: 100%;
    }
    .video-wrapper .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
      overflow: hidden;
      border-radius: 4px;
    }
    .video-wrapper .video-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }
    .video-overlay {
      position: absolute;
      top: 0.5em;
      left: 0.5em;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 0.2em 0.6em;
      font-size: 1.2em;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <!-- Header + Nav -->
  <header>
    <h1>Portfolio</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Main: video gallery -->
  <main>
    <h2>Our Work</h2>
    <p>Click each reel below to watch examples of our work:</p>

    <!-- Paid Advertisements Section -->
    <h3 class="section-subheading">Paid Advertisements</h3>

    <div class="video-wrapper">
      <div class="video-overlay">Attention</div>
      <div class="video-container">
        <iframe
          src="https://www.youtube.com/embed/a1mpG-5KQdM"
          title="Paid Advertisement Reel: Attention"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <div class="video-wrapper">
      <div class="video-overlay">Information</div>
      <div class="video-container">
        <iframe
          src="https://www.youtube.com/embed/8wsn8em40kA"
          title="Paid Advertisement Reel: Information"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- Product Showcase Section -->
    <h3 class="section-subheading">Product Showcase</h3>

    <div class="video-wrapper">
      <div class="video-overlay">Stylized</div>
      <div class="video-container">
        <iframe
          src="https://www.youtube.com/embed/9Ww8lKTDt2g"
          title="Product Showcase: Stylized"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <div class="video-wrapper">
      <div class="video-overlay">Neutral</div>
      <div class="video-container">
        <iframe
          src="https://www.youtube.com/embed/-aTMhZxtClY"
          title="Product Showcase: Neutral"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    &copy; 2025 Hedonics Video Marketing
  </footer>
</body>
</html>
